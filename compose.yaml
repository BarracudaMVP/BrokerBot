services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brokerbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brokerbot}
      POSTGRES_DB: brokerbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Наружу — только для psql и локальных тестов.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerbot -d brokerbot"]
      interval: 2s
      timeout: 3s
      retries: 15

  bot:
    build: .
    env_file:
      # Не обязателен: `compose up db` должен работать и без .env.
      - path: .env
        required: false
    environment:
      # Перебивает DATABASE_URL из .env: внутри сети compose база зовётся db.
      DATABASE_URL: postgres://brokerbot:${POSTGRES_PASSWORD:-brokerbot}@db:5432/brokerbot?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
